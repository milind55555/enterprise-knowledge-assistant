name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Unit and API tests
        run: pytest -q
      - name: RAG evaluation gate (fails the build if quality or security regresses)
        run: python -m eval.run_eval
      - name: Publish evaluation report
        if: always()
        run: cat eval/results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval/results/ }

  docker:
    runs-on: ubuntu-latest
    needs: test-and-evaluate
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t knowledge-assistant .
